environment:
  # Visual Studio Version
  MSVS_VERSION: 2017
  # Test against these Node.js versions
  matrix:
    - nodejs_version: "16"
    - nodejs_version: "18"
    - nodejs_version: "20"


platform:
  - x64

# Install scripts. (runs after repo cloning)
install:
  # Get the latest stable version of Node.js or io.js
  - ps: Install-Product node $env:nodejs_version $env:Platform
  # install modules
  - node --version
  - npm install -g npm@latest
  - npm --version
  - npm ci --ignore-scripts

# Build script (forces Script mode instead of default MSBuild mode).
build_script:
  - npm run install-debug

# Post-install test scripts.
test_script:
  # run tests
  - node test\index.js
