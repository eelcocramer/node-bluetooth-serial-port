image: Visual Studio 2019

environment:
  # Visual Studio Version
  MSVS_VERSION: 2017
  # Test against these Node.js versions
  matrix:
    - nodejs_version: "18"
    - nodejs_version: "20"
    - nodejs_version: "22"
    - nodejs_version: "24"


platform:
  - x64

# Install scripts. (runs after repo cloning)
install:
  # Get the latest stable version of Node.js or io.js
  - ps: Install-Product node $env:nodejs_version $env:Platform
  # install gh CLI
  - ps: |
      choco install gh -y --no-progress
      $ghCmd = Get-Command gh.exe -ErrorAction SilentlyContinue
      if (-not $ghCmd) {
        throw "GitHub CLI (gh.exe) not found after installation."
      }
      & $ghCmd.Source --version
  # install modules
  - node --version
  - npm --version
  - npm ci --ignore-scripts

# Disable automatic MSBuild discovery (there is no .sln/.vcxproj in repo root).
build: off

# Post-install test scripts.
test_script:
  # run tests
  - npm run install-release
  - node test\index.js
  - ps: |
      $ErrorActionPreference = "Stop"

      function Find-GhPath {
        $cmd = Get-Command gh.exe -ErrorAction SilentlyContinue
        if ($cmd) { return $cmd.Source }

        $candidates = @(
          "$env:ProgramFiles\GitHub CLI\gh.exe",
          "$env:ChocolateyInstall\bin\gh.exe"
        )

        foreach ($candidate in $candidates) {
          if (Test-Path $candidate) { return $candidate }
        }

        throw "GitHub CLI (gh.exe) is required for release uploads but was not found."
      }

      function Invoke-Gh([string]$ghPath, [string[]]$args) {
        & $ghPath @args
        if ($LASTEXITCODE -ne 0) {
          throw "gh command failed (exit code $LASTEXITCODE): gh $($args -join ' ')"
        }
      }

      if ($env:APPVEYOR_REPO_TAG -eq "true" -and $env:GITHUB_TOKEN) {
        $ghPath = Find-GhPath
        node scripts\create-prebuilds.js --strip
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to create prebuild artifacts."
        }

        $tag = $env:APPVEYOR_REPO_TAG_NAME
        & $ghPath release view $tag --repo $env:APPVEYOR_REPO_NAME *> $null
        if ($LASTEXITCODE -ne 0) {
          Invoke-Gh $ghPath @("release", "create", $tag, "--title", $tag, "--notes", "", "--repo", $env:APPVEYOR_REPO_NAME)
        }

        Get-ChildItem prebuilds -Recurse -Filter *.node | ForEach-Object {
          $platformArch = Split-Path $_.DirectoryName -Leaf
          $assetName    = "$platformArch--$($_.Name)"
          $tempPath     = Join-Path $env:TEMP $assetName
          Copy-Item $_.FullName $tempPath
          Invoke-Gh $ghPath @("release", "upload", $tag, $tempPath, "--clobber", "--repo", $env:APPVEYOR_REPO_NAME)
          Remove-Item $tempPath
        }
      }
