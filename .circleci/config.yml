# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

orbs:
  # The Node.js orb contains a set of prepackaged CircleCI configuration you can utilize
  # Orbs reduce the amount of configuration required for common tasks.
  # See the orb documentation here: https://circleci.com/developer/orbs/orb/circleci/node
  node: circleci/node@4.7

jobs:
  build-18:
    docker:
      - image: node:18
    steps:
      - checkout
      - run:
          name: install build dependencies
          command: |
            apt-get update && apt-get install -y build-essential libbluetooth-dev
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list
            apt-get update && apt-get install -y gh
      - node/install-packages
      - run:
          name: build native addon
          command: npm run install-release
      - run:
          name: run tests
          command: npm test
      - run:
          name: upload prebuilds for tagged releases
          command: |
            if [ -n "$CIRCLE_TAG" ] && [ -n "$GITHUB_TOKEN" ]; then
              node scripts/create-prebuilds.js --strip
              for f in prebuilds/*/*; do
                platform_arch=$(basename $(dirname "$f"))
                asset_name="${platform_arch}--$(basename "$f")"
                cp "$f" "/tmp/$asset_name"
              gh release upload "$CIRCLE_TAG" "/tmp/$asset_name" --clobber --repo "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME"
              rm "/tmp/$asset_name"
              done
            fi
